const $=id=>document.getElementById(id);
function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function toast(msg,type="ok"){
  const t=$("toast");
  if(!t)return;
  t.textContent=msg;
  t.style.background=type==="error"?"#b91c1c":type==="warn"?"#92400e":type==="copy"?"#059669":"#111827";
  t.classList.add("show");
  clearTimeout(window.__toast);
  window.__toast=setTimeout(()=>t.classList.remove("show"),2600);
}

async function copyText(text, successMsg="تم نسخ الرابط بنجاح! 📋", btnEl=null){
  if(!text){toast("لا يوجد رابط أو نص لنسخه","warn");return false}
  let copied=false;
  try{
    if(navigator.clipboard && window.isSecureContext){
      await navigator.clipboard.writeText(text);
      copied=true;
    }
  }catch(e){copied=false}

  if(!copied){
    try{
      const ta=document.createElement("textarea");
      ta.value=text;
      ta.style.position="fixed";
      ta.style.left="-9999px";
      ta.style.top="-9999px";
      ta.setAttribute("readonly","");
      document.body.appendChild(ta);
      ta.focus();
      ta.select();
      ta.setSelectionRange(0,99999);
      copied=document.execCommand("copy");
      document.body.removeChild(ta);
    }catch(err){copied=false}
  }

  if(copied){
    toast(successMsg,"copy");
    if(btnEl){
      const orig=btnEl.innerHTML;
      btnEl.innerHTML="✓ تم النسخ";
      btnEl.style.background="var(--success)";
      btnEl.style.color="#fff";
      setTimeout(()=>{
        btnEl.innerHTML=orig;
        btnEl.style.background="";
        btnEl.style.color="";
      },1600);
    }
    return true;
  }
  return false;
}

function extractYouTubeId(url){
  if(!url || typeof url !== "string") return null;
  let raw = url.trim();
  if(!raw) return null;

  if(raw.includes("<iframe") && raw.includes("src=")){
    const m = raw.match(/src=["']([^"']+)["']/i);
    if(m && m[1]) raw = m[1].trim();
  }

  raw = raw.replace(/[<>\(\)\[\]"']/g, "").trim();

  if(/^(?:www\.)?(?:youtube\.com|youtu\.be)\//i.test(raw)){
    raw = "https://" + raw;
  }

  const ytMatch = raw.match(/(?:https?:\/\/)?(?:www\.|m\.)?(?:youtube(?:-nocookie)?\.com\/(?:watch\?(?:.*&)?v=|embed\/|v\/|shorts\/|live\/)|youtu\.be\/)([a-zA-Z0-9_-]{11})/i);
  if(ytMatch && ytMatch[1]){
    return ytMatch[1];
  }
  return null;
}

function getVideoEmbedInfo(url, useNoCookie=true){
  if(!url||typeof url!=="string")return null;
  let raw=url.trim();
  if(!raw)return null;

  const ytId = extractYouTubeId(raw);
  if(ytId){
    const domain = useNoCookie ? "https://www.youtube-nocookie.com" : "https://www.youtube.com";
    const src = `${domain}/embed/${ytId}?rel=0&enablejsapi=1&playsinline=1`;
    return {
      type: "youtube",
      id: ytId,
      src: src,
      embedUrl: `${domain}/embed/${ytId}`,
      iframeCode: `<iframe width="100%" height="450" src="${src}" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>`,
      title: "فيديو يوتيوب 🎬"
    };
  }

  const driveMatch=raw.match(/drive\.google\.com\/file\/d\/([a-zA-Z0-9_-]+)/i);
  if(driveMatch&&driveMatch[1]){
    const id=driveMatch[1];
    return {
      type:"drive",
      id,
      src:`https://drive.google.com/file/d/${id}/preview`,
      embedUrl:`https://drive.google.com/file/d/${id}/preview`,
      iframeCode:`<iframe width="100%" height="450" src="https://drive.google.com/file/d/${id}/preview" frameborder="0" allow="autoplay; fullscreen" allowfullscreen></iframe>`,
      title:"فيديو جوجل درايف 📁"
    };
  }

  const vimeoMatch=raw.match(/vimeo\.com\/(?:channels\/(?:\w+\/)?|groups\/([^\/]*)\/videos\/|album\/(\d+)\/video\/|)(\d+)/i);
  if(vimeoMatch&&vimeoMatch[3]){
    const id=vimeoMatch[3];
    return {
      type:"vimeo",
      id,
      src:`https://player.vimeo.com/video/${id}?autoplay=1`,
      embedUrl:`https://player.vimeo.com/video/${id}`,
      iframeCode:`<iframe width="100%" height="450" src="https://player.vimeo.com/video/${id}?autoplay=1" frameborder="0" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen></iframe>`,
      title:"فيديو فيميو 🎥"
    };
  }

  const isDirect=raw.match(/\.(mp4|webm|mov|m4v)(\?.*)?$/i) || raw.includes("supabase.co/storage") || raw.includes("/videos/");
  if(isDirect){
    return {
      type:"direct",
      src:raw,
      embedUrl:raw,
      iframeCode:`<video width="100%" height="auto" controls autoplay src="${raw}"></video>`,
      title:"فيديو مباشر MP4 ⚡"
    };
  }

  if(raw.startsWith("http://")||raw.startsWith("https://")){
    return {
      type:"generic",
      src:raw,
      embedUrl:raw,
      iframeCode:`<iframe width="100%" height="450" src="${raw}" frameborder="0" allowfullscreen></iframe>`,
      title:"رابط خارجي 🌐"
    };
  }

  return null;
}

function togglePlayerServer(previewId, videoUrl){
  const container = $(previewId);
  if(!container) return;
  const current = container.dataset.nocookie !== "false";
  container.dataset.nocookie = current ? "false" : "true";
  const inp = container.closest(".field")?.querySelector("[data-field-input]");
  updateVideoPreview(inp || {value: videoUrl}, previewId);
  toast(current ? "تم التبديل لمشغل YouTube القياسي" : "تم التبديل لمشغل No-Cookie المحمي");
}

  if(!text){

async function handleSingleFileInput(fileInput, path, previewId=null){
  const file = fileInput.files?.[0];
  if(!file) return;
  const p = fileInput.closest(".field")?.querySelector("[data-field-input]");
  toast("جاري معالجة وتثبيت الملف... ⚡");
  try{
    const url = await uploadFileToStorage(file);
    if(p){
      p.value = url;
      p.dispatchEvent(new Event("input"));
    }
    const key = path.startsWith("m.") ? path.slice(2) : path;
    const directInput = document.querySelector(`[data-m="${key}"]`);
    if(directInput) directInput.value = url;
    if(!path.startsWith("m.")) setPath(path, url);

    if(previewId){
      updateVideoPreview(p, previewId);
    }
    toast("تم تجهيز وتثبيت الصورة بنجاح ✓");
  }catch(e){
    toast("حدث خطأ أثناء معالجة الصورة: " + e.message, "error");
  }
}

async function api(path,options={}){
  const r=await fetch(CONFIG.url+path,{
    ...options,
    headers:{"apikey":CONFIG.key,"Authorization":"Bearer "+CONFIG.key,"Content-Type":"application/json",...(options.headers||{})}
  });
  const text=await r.text();
  let data={};
  try{data=text?JSON.parse(text):{}}catch{data={message:text}}
  if(!r.ok)throw new Error(data.message||data.error||"حدث خطأ في الاتصال");
  return data;
}

async function rpc(name,args){return api("/rest/v1/rpc/"+name,{method:"POST",body:JSON.stringify(args)})}

function normalizeSnapshot(s){
  const d=initialSnapshot();
  return Object.assign(d,s||{},{
    branding:Object.assign(d.branding,(s||{}).branding||{}),
    watermark:Object.assign(d.branding.watermark,((s||{}).branding||{}).watermark||{}),
    whatsapp:Object.assign(d.branding.whatsapp,((s||{}).branding||{}).whatsapp||{}),
    courses:Array.isArray(s?.courses)?s.courses:d.courses,
    quizzes:Array.isArray(s?.quizzes)?s.quizzes:d.quizzes,
    categories:Array.isArray(s?.categories)?s.categories:d.categories,
    homepage_sections:Array.isArray(s?.homepage_sections)?s.homepage_sections:d.homepage_sections,
    banners:Array.isArray(s?.banners)?s.banners:[],
    notifications:Array.isArray(s?.notifications)?s.notifications:[],
    announcements:Array.isArray(s?.announcements)?s.announcements:[],
    testimonials:Array.isArray(s?.testimonials)?s.testimonials:[],
    faqs:Array.isArray(s?.faqs)?s.faqs:[],
    pages:Array.isArray(s?.pages)?s.pages:[],
    navigation:Array.isArray(s?.navigation)?s.navigation:[],
    media:Array.isArray(s?.media)?s.media:d.media,
    auditLogs:Array.isArray(s?.auditLogs)?s.auditLogs:d.auditLogs
  });
}

async function load(){
  try{
    if(state.password){
      const d=await rpc("admin_dashboard_data",{p_password:state.password});
      if(d && d.snapshot){
        const remote = normalizeSnapshot(d.snapshot);
        const mergedCourses = [...(remote.courses||[])];
        for(const lc of (state.snapshot.courses||[])){
          if(!mergedCourses.some(rc=>rc.id===lc.id)){
            mergedCourses.push(lc);
          }
        }
        remote.courses = mergedCourses;
        state.snapshot = remote;
      }
      if(d) {
        state.dashboard = Object.assign({}, state.dashboard, d);
      }
    }
  }catch(e){
    console.warn("استخدام التخزين المحلي:", e.message);
  }
  
  try{
    const cached=localStorage.getItem("abuqaoud_snapshot");
    if(cached){
      const parsed=JSON.parse(cached);
      if(Array.isArray(parsed?.courses)){
        for(const c of parsed.courses){
          if(!state.snapshot.courses.some(x=>x.id===c.id)){
            state.snapshot.courses.push(c);
          }
        }
      }
    }
    const cachedStudents=localStorage.getItem("abuqaoud_students_data");
    if(cachedStudents){
      const parsedStudents = JSON.parse(cachedStudents);
      if(Array.isArray(parsedStudents) && parsedStudents.length){
        state.dashboard.students = parsedStudents;
      }
    }
  }catch(e){}

  renderNav();
  render();
  applyTheme();
}

function audit(action,entity,previous=null,next=null){
  state.snapshot.auditLogs.unshift({id:crypto.randomUUID(),action,entity,time:new Date().toISOString(),previous,next});
  state.snapshot.auditLogs=state.snapshot.auditLogs.slice(0,500);
}

async function sync(message="تم الحفظ بنجاح"){
  try{
    localStorage.setItem("abuqaoud_snapshot", JSON.stringify(state.snapshot));
    localStorage.setItem("abuqaoud_students_data", JSON.stringify(state.dashboard.students||[]));
    localStorage.setItem("abuqaoud_admin_last_sync", Date.now());
  }catch(e){}

  try{
    if(state.password){
      await rpc("sync_platform_snapshot",{p_password:state.password,p_snapshot:state.snapshot});
    }
    toast(message);
  }catch(e){
    toast(message + " (تم الحفظ محلياً)","ok");
  }
}

function renderNav(){
  const n=$("nav");
  n.innerHTML=NAV.map(([id,label,ic])=>`
    <button class="${state.section===id?"active":""}" data-nav="${id}">
      <span>${ic}</span>
      <span>${label}</span>
    </button>
  `).join("");
  n.querySelectorAll("[data-nav]").forEach(b=>b.onclick=()=>{
    state.section=b.dataset.nav;
    $("sidebar").classList.remove("open");
    renderNav();
    render();
  });
}

function applyTheme(){
  const b=state.snapshot.branding||{};
  document.documentElement.style.setProperty("--primary",b.primaryColor||"#2563eb");
  document.documentElement.style.setProperty("--secondary",b.secondaryColor||"#0f766e");
  document.documentElement.style.setProperty("--accent",b.accentColor||"#f59e0b");
  const mode=b.defaultTheme||"device";
  const dark=mode==="dark"||(mode==="device"&&matchMedia("(prefers-color-scheme:dark)").matches);
  document.body.classList.toggle("dark",dark);
}

function header(title,sub,actions=""){
  return `<div class="page-head">
    <div>
      <h2>${title}</h2>
      <p>${sub||""}</p>
    </div>
    <div class="actions">${actions}</div>
  </div>`;
}

function render(){
  applyTheme();
  const c=$("content");
  const map={
    dashboard:renderDashboard,
    branding:renderBranding,
    homepage:renderHomepage,
    courses:renderCourses,
    lessons:renderLessons,
    quizzes:renderQuizzes,
    students:renderStudents,
    results:renderResults,
    enrollments:renderEnrollments,
    media:renderMedia,
    content:renderContent,
    notifications:renderNotifications,
    settings:renderSettings
  };
  c.innerHTML=(map[state.section]||renderDashboard)();
}

function field(label,value,path,type="text",min="",max="",step=""){
  const isModalField = String(path||"").startsWith("m.");
  const mKey = isModalField ? String(path).slice(2) : "";
  return `<div class="field">
    <label>${label}</label>
    <input type="${type}" value="${esc(value??"")}" ${min?`min="${min}"`:""} ${max?`max="${max}"`:""} ${step?`step="${step}"`:""} ${isModalField ? `data-m="${esc(mKey)}"` : `data-path="${esc(path)}" oninput="setPath(this.dataset.path,this.value)"`}>
  </div>`;
}

function colorField(label,value,path){
  return `<div class="field">
    <label>${label}</label>
    <div class="color-row">
      <input type="color" value="${esc(value||"#2563eb")}" onchange="setPath('${path}',this.value)">
      <input value="${esc(value||"")}" oninput="setPath('${path}',this.value)">
    </div>
  </div>`;
}

function toggleField(label,path,val){
  return `<label class="switch">
    <input type="checkbox" ${val?"checked":""} onchange="setPath('${path}',this.checked)">
    <span>${label}</span>
  </label>`;
}

function setPath(path,value){
  const p=path.split(".");
  let o=state.snapshot;
  for(let i=0;i<p.length-1;i++){
    if(!o[p[i]]||typeof o[p[i]]!=="object")o[p[i]]={};
    o=o[p[i]];
  }
  o[p[p.length-1]]=value;
}

async function duplicateCourse(id){
  const original=state.snapshot.courses.find(x=>x.id===id);
  if(!original)return;
  const clone=JSON.parse(JSON.stringify(original));
  clone.id=crypto.randomUUID();
  clone.title=(clone.title||"كورس")+" (نسخة مكررة)";
  clone.published=false;
  if(Array.isArray(clone.lessons)){
    clone.lessons=clone.lessons.map(l=>({...l,id:crypto.randomUUID(),courseId:clone.id}));
  }
  state.snapshot.courses.unshift(clone);
  audit("تم نسخ كورس","الكورسات");
  render();
  await sync("تم إنشاء نسخة من الكورس بنجاح");
}

function readModal(){
  const modalEl = document.getElementById("modalRoot") || document;
  const o={};
  modalEl.querySelectorAll("[data-m]").forEach(el=>{
    let v=el.type==="checkbox"?el.checked:el.value;
    const k=el.dataset.m;
    if(!k) return;
    o[k]=["requirements","outcomes","tags"].includes(k)?(typeof v==="string"?v.split(",").map(x=>x.trim()).filter(Boolean):v):v;
  });
  return o;
}

async function saveCourse(id,editing){
  try{
    await uploadFormFiles();
  }catch(e){
    console.warn("ملفات النموذج:", e);
  }
  const m=readModal();

  const titleEl = document.getElementById("course_title_input");
  const shortDescEl = document.getElementById("course_desc_input");
  const fullDescEl = document.getElementById("course_full_desc");
  if(titleEl && titleEl.value) m.title = titleEl.value;
  if(shortDescEl && shortDescEl.value) m.shortDescription = shortDescEl.value;
  if(fullDescEl && fullDescEl.value) m.fullDescription = fullDescEl.value;

  m.title = (m.title || "").trim();
  if(!m.title){
    toast("يرجى كتابة اسم الكورس أولاً","warn");
    if(titleEl) titleEl.focus();
    return;
  }

  m.id = id || crypto.randomUUID();
  m.shortDescription = (m.shortDescription || "").trim();
  m.fullDescription = (m.fullDescription || "").trim();
  m.price = Number(m.price || 0);
  m.discountPrice = Number(m.discountPrice || 0);
  m.order = Number(m.order || 0);
  m.published = m.published !== false;
  
  if(!Array.isArray(state.snapshot.courses)) state.snapshot.courses = [];
  const existingIdx = state.snapshot.courses.findIndex(x => x.id === m.id);
  if(existingIdx >= 0){
    m.lessons = state.snapshot.courses[existingIdx].lessons || [];
    state.snapshot.courses[existingIdx] = Object.assign({}, state.snapshot.courses[existingIdx], m);
  } else {
    m.lessons = [];
    state.snapshot.courses.unshift(m);
  }

  if(state.dashboard && state.dashboard.stats){
    state.dashboard.stats.courses = state.snapshot.courses.length;
  }

  audit(existingIdx >= 0 ? "تم تعديل كورس" : "تمت إضافة كورس", "الكورسات");
  closeModal();
  
  render();
  await sync(existingIdx >= 0 ? "تم تعديل الكورس بنجاح" : "تمت إضافة الكورس بنجاح");
}

async function toggleCourse(id){
  const c=state.snapshot.courses.find(x=>x.id===id);
  if(!c)return;
  c.published=c.published===false;
  render();
  await sync(c.published?"تم نشر الكورس":"تم إلغاء نشر الكورس");
}

async function removeCourseAction(id){
  state.snapshot.courses=state.snapshot.courses.filter(x=>x.id!==id);
  if(state.dashboard && state.dashboard.stats){
    state.dashboard.stats.courses = state.snapshot.courses.length;
  }
  audit("تم حذف كورس","الكورسات");
  render();
  await sync("تم حذف الكورس بنجاح");
}

async function removeItem(collection,id,label){
  const old=state.snapshot[collection]?.find(x=>x.id===id);
  state.snapshot[collection]=state.snapshot[collection].filter(x=>x.id!==id);
  audit("تم حذف "+label,label,old,null);
  render();
  await sync("تم الحذف بنجاح");
}

async function saveLesson(id,btn){
  if(btn){btn.disabled=true;btn.textContent="جاري الحفظ..."}
  try{
    await uploadFormFiles();
    const m=readModal();
    const titleEl = document.getElementById("lesson_title_input");
    if(titleEl && titleEl.value) m.title = titleEl.value;

    m.title = (m.title || "").trim();
    if(!m.title){
      toast("يرجى كتابة عنوان المحاضرة أولاً","warn");
      if(titleEl) titleEl.focus();
      if(btn){btn.disabled=false;btn.textContent="✓ حفظ ونشر المحاضرة ⚡"}
      return;
    }

    m.id=id||crypto.randomUUID();
    m.lectureNumber=Number(m.lectureNumber||1);
    m.order=Number(m.order||m.lectureNumber||0);
    m.videoUrls=[m.videoUrl1||"",m.videoUrl2||""].filter(Boolean);
    m.videoUrl=m.videoUrls[0]||"";
    delete m.videoUrl1;
    delete m.videoUrl2;
    m.pdfUrl=m.pdfUrl||"";
    m.thumbnail=m.thumbnail||"";
    
    const targetId=$("lessonCourse")?.value;
    const c=(state.snapshot.courses||[]).find(x=>x.id===targetId);
    if(!c)return;
    if(!Array.isArray(c.lessons))c.lessons=[];
    let old=c.lessons.find(x=>x.id===m.id);
    if(old)Object.assign(old,m);else c.lessons.push(m);
    c.lessons.sort((a,b)=>Number(a.lectureNumber||a.order||0)-Number(b.lectureNumber||b.order||0));
    
    audit(old?"تم تعديل محاضرة":"تمت إضافة محاضرة","المحاضرات");
    closeModal();
    render();
    await sync(old?"تم تعديل المحاضرة بنجاح":"تم حفظ المحاضرة بنجاح");
  }catch(err){
    toast(err.message||"حدث خطأ أثناء الحفظ","error");
  }finally{
    if(btn){btn.disabled=false;btn.textContent="✓ حفظ ونشر المحاضرة ⚡"}
  }
}

      </select>
    </div>
  </div>
  <div class="form-actions">
    <button class="btn" onclick="saveStudent('${id||s.id||""}')">✓ حفظ بيانات الطالب والمحفظة</button>
    <button class="btn secondary" onclick="closeModal()">إلغاء</button>

async function saveStudent(id){
  const p=readModal();
  if(!p.name||!p.phone){toast("الاسم ورقم الهاتف مطلوبان","error");return}
  p.wallet = Number(p.wallet || 0);

  if(!state.dashboard) state.dashboard = {};
  if(!Array.isArray(state.dashboard.students)) state.dashboard.students = [];

  const existingIdx = id ? state.dashboard.students.findIndex(x => x.id === id) : -1;
  if(existingIdx >= 0){
    state.dashboard.students[existingIdx] = Object.assign({}, state.dashboard.students[existingIdx], p);
    audit("تم تعديل بيانات الطالب ورصيد المحفظة: " + p.name, "الطلاب");
  } else {
    p.id = id || crypto.randomUUID();
    p.registered_at = new Date().toISOString();
    p.average = 0;
    p.enrollments = [];
    state.dashboard.students.unshift(p);
    audit("تمت إضافة طالب جديد: " + p.name, "الطلاب");
  }

  if(state.dashboard.stats){
    state.dashboard.stats.students = state.dashboard.students.length;
  }

  closeModal();
  render();
  await sync("تم حفظ بيانات الطالب ورصيد المحفظة بنجاح");
}

function renderMedia(){
  const media=state.snapshot.media||[];
  const filter=(state.mediaFilter||"").trim().toLowerCase();
  const filtered=media.filter(x=>{
    if(!filter)return true;
    return (x.name||"").toLowerCase().includes(filter)||(x.url||"").toLowerCase().includes(filter)||(x.type||"").toLowerCase().includes(filter);
  });
  return header("الصور والملفات","رفع واستعراض ونسخ وحذف وسائط المنصة",`<button class="btn" onclick="uploadModal()">+ رفع ملف جديد ⚡</button>`)+`
  <div class="panel">
    <div class="toolbar" style="align-items:center;justify-content:space-between">
      <input placeholder="بحث في أسماء أو روابط الملفات..." value="${esc(state.mediaFilter||"")}" oninput="state.mediaFilter=this.value;renderMediaList()" style="flex:1;max-width:420px;padding:11px 14px;border:1px solid var(--border);border-radius:12px;background:var(--surface);color:var(--text)">

function renderMediaGrid(list){
  if(!list.length)return `<div class="empty" style="grid-column:1/-1">لا توجد ملفات متطابقة</div>`;
  return `<div class="media-grid">
    ${list.map(x=>{
      const isVid=String(x.type||"").startsWith("video")||String(x.url||"").match(/\.(mp4|webm|mov|m4v)(\?.*)?$/i);
      const isPdf=String(x.type||"").includes("pdf")||String(x.url||"").match(/\.pdf(\?.*)?$/i);
      return `<div class="media-card" id="media_${esc(x.id)}">
        ${isVid?`<video src="${esc(x.url)}" controls preload="metadata"></video>`:isPdf?`<div style="height:130px;display:grid;place-items:center;background:rgba(37,99,235,.07);color:var(--primary);font-size:36px">📄</div>`:`<img src="${esc(x.url)}" onerror="this.src='https://placehold.co/300x150/2563eb/ffffff?text=Image'">`}
        <div class="meta">
          <b style="font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis" title="${esc(x.name||"ملف")}">${esc(x.name||"ملف")}</b>
          <div class="muted" style="font-size:11px">${esc(x.type||"ملف")} ${x.size?`• ${(x.size/1024/1024).toFixed(2)} MB`:""}</div>
          
          <div style="position:relative;margin:4px 0">
            <input type="text" readonly value="${esc(x.url)}" style="width:100%;font-size:11px;padding:6px 52px 6px 8px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--muted);direction:ltr;text-align:left" onclick="this.select()">
            <button type="button" class="btn small" style="position:absolute;left:3px;top:50%;transform:translateY(-50%);padding:3px 8px;font-size:11px" onclick="copyMediaUrl('${esc(x.id)}', this)">نسخ 📋</button>
          </div>

          <div class="actions" style="margin-top:auto;padding-top:4px">
            <button class="btn small success" style="flex:1" onclick="copyMediaUrl('${esc(x.id)}', this)">نسخ الرابط 📋</button>
            ${isVid ? `<button class="btn small secondary" onclick="copyMediaEmbed('${esc(x.id)}', this)" title="نسخ كود التضمين">تضمين 🔗</button>` : ""}
            <a href="${esc(x.url)}" target="_blank" class="btn small secondary" style="text-decoration:none">معاينة ↗</a>
            <button class="btn small danger" onclick="deleteMedia('${esc(x.id)}')">حذف</button>
          </div>
        </div>
      </div>`;
    }).join("")}
  </div>`;
}

function renderMediaList(){
  const container=$("mediaListContainer");
  if(!container)return;
  const media=state.snapshot.media||[];
  const filter=(state.mediaFilter||"").trim().toLowerCase();
  const filtered=media.filter(x=>{
    if(!filter)return true;
    return (x.name||"").toLowerCase().includes(filter)||(x.url||"").toLowerCase().includes(filter)||(x.type||"").toLowerCase().includes(filter);
  });
  container.innerHTML=renderMediaGrid(filtered);

function uploadModal(){
  modal("رفع ملف جديد",`<div class="upload">
    <p>اختر صورة أو فيديو أو ملفًا تعليميًا من جهازك للحفظ في قاعدة البيانات</p>
    <input id="mediaFile" type="file" accept="image/*,video/*,.pdf,.doc,.docx,.ppt,.pptx,.zip">
  </div>
  <div class="form-actions">
    <button class="btn" id="uploadMediaBtn" onclick="uploadMedia()">رفع وحفظ في القاعدة ✓</button>
    <button class="btn secondary" onclick="closeModal()">إلغاء</button>
  </div>`);
}

async function uploadFileToStorage(file){
  if(!file) return "";
  const ext = file.name.split('.').pop() || 'png';
  const cleanName = `${Date.now()}_${Math.random().toString(36).slice(2,8)}.${ext}`;
  
  try {
    const uploadRes = await fetch(`${CONFIG.url}/storage/v1/object/media/${cleanName}`, {
      method: "POST",
      headers: {
        "apikey": CONFIG.key,
        "Authorization": "Bearer " + CONFIG.key,
        "Content-Type": file.type || "application/octet-stream"
      },
      body: file
    });
    if(uploadRes.ok){
      return `${CONFIG.url}/storage/v1/object/public/media/${cleanName}`;
    }
  } catch(e) {
    console.warn("جاري استخدام التخزين الدائم المباشر في القاعدة:", e);
  }

  return new Promise((resolve) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = () => resolve(URL.createObjectURL(file));
    reader.readAsDataURL(file);
  });
}

async function uploadMedia(){
  const f=$("mediaFile")?.files?.[0];
  if(!f){toast("اختر ملفًا أولًا","warn");return}
  const btn = $("uploadMediaBtn");
  if(btn){btn.disabled=true;btn.textContent="جاري الرفع والحفظ..."}

  try{
    const permUrl = await uploadFileToStorage(f);
    state.snapshot.media.unshift({
      id:crypto.randomUUID(),
      name:f.name,
      type:f.type||"application/octet-stream",
      size:f.size,
      path:"media/"+f.name,
      url:permUrl,
      createdAt:new Date().toISOString()
    });
    audit("تم رفع وتثبيت ملف جديد: " + f.name,"الوسائط");
    closeModal();
    render();
    await sync("تم رفع وحفظ الملف في قاعدة البيانات بنجاح");
  }catch(err){
    toast("حدث خطأ أثناء الرفع: " + err.message, "error");
  }finally{
    if(btn){btn.disabled=false;btn.textContent="رفع وحفظ في القاعدة ✓"}
  }
}

async function deleteMedia(id){
  state.snapshot.media=state.snapshot.media.filter(m=>m.id!==id);
  audit("تم حذف ملف","الوسائط");
  render();
  await sync("تم حذف الملف");
}

async function uploadFormFiles(){
  for(const el of document.querySelectorAll("[data-file-path]")){
    const f=el.files?.[0];
    if(f){
      const url=await uploadFileToStorage(f);
      const path=el.dataset.filePath;
      if(path.startsWith("m.")){
        const h=document.querySelector(`[data-m="${path.slice(2)}"]`);
        if(h)h.value=url;
      }else setPath(path,url);
    }
  }
}

        <h3>${title}</h3>
        <button class="close" onclick="closeModal()">×</button>
      </div>

  </div>`;
}

$("exportBtn").onclick=()=>{
  const data=JSON.stringify(state.snapshot,null,2);
  const blob=new Blob([data],{type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="abuqaoud_backup_"+new Date().toISOString().slice(0,10)+".json";
  a.click();
  toast("تم تصدير النسخة الاحتياطية بنجاح 💾");
};

$("importBtn").onclick=()=>{$("importFile").click()};
$("importFile").onchange=e=>{
  const f=e.target.files[0];
  if(!f)return;
  const reader=new FileReader();
  reader.onload=async ev=>{
    try{
      const imported=JSON.parse(ev.target.result);
      state.snapshot=normalizeSnapshot(imported);
      render();
      await sync("تم استيراد النسخة الاحتياطية بنجاح");
    }catch(err){
      toast("ملف غير صالح","error");
    }
  };
  reader.readAsText(f);
};

if(localStorage.getItem("abuqaoud_admin_theme")==="dark")document.body.classList.add("dark");
</script>
